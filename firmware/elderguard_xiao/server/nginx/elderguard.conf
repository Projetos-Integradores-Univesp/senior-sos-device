# elderguard.conf — nginx
# O placeholder ${SECRET_MQTT_BROKER} deve ser substituído antes do deploy:
#   envsubst '${SECRET_MQTT_BROKER}' < elderguard.conf > /etc/nginx/sites-available/elderguard

# /etc/nginx/sites-available/elderguard
# nginx para ${SECRET_MQTT_BROKER} — serve o dashboard e proxia WebSocket para Mosquitto

# Redirecionar HTTP → HTTPS
server {
    listen 80;
    server_name ${SECRET_MQTT_BROKER};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${SECRET_MQTT_BROKER};

    # TLS — Let's Encrypt ou certificado próprio
    ssl_certificate     /etc/letsencrypt/live/${SECRET_MQTT_BROKER}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SECRET_MQTT_BROKER}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # -----------------------------------------------------------------------
    # Dashboard — arquivos estáticos
    # -----------------------------------------------------------------------
    root /var/www/elderguard;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # MQTT sobre WebSocket — proxy para Mosquitto porta 9001
    # O dashboard conecta em: wss://${SECRET_MQTT_BROKER}/mqtt
    # -----------------------------------------------------------------------
    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
