# /etc/mosquitto/conf.d/elderguard.conf
# Mosquitto broker configuration — ElderGuard XIAO ESP32S3
# Copiar para: /etc/mosquitto/conf.d/elderguard.conf no servidor VPS

# ============================================================================
# Listeners
# ============================================================================

# MQTT padrão — dispositivo conecta via WiFi
listener 1883
protocol mqtt

# WebSocket — usado pelo dashboard web (proxiado pelo nginx em /mqtt)
listener 9001
protocol websockets

# ============================================================================
# Autenticação
# ============================================================================

# Arquivo de senhas — criar com: mosquitto_passwd -c /etc/mosquitto/passwd elderguard
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# ============================================================================
# Persistência (retained messages sobrevivem a reinicializações do broker)
# ============================================================================

persistence true
persistence_location /var/lib/mosquitto/
persistence_file elderguard.db
autosave_interval 300

# ============================================================================
# Logging
# ============================================================================

log_dest file /var/log/mosquitto/elderguard.log
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ============================================================================
# Limites
# ============================================================================

max_inflight_messages 20
max_queued_messages 1000
message_size_limit 4096
