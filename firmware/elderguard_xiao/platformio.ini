; PlatformIO — ElderGuard XIAO ESP32S3
; pio run -t upload
;
; CREDENCIAIS DO BROKER MQTT
; Defina as variáveis de ambiente antes de compilar:
;
;   export SECRET_MQTT_BROKER=seu-broker.exemplo.com
;   export SECRET_MQTT_USERNAME=elderguard
;   export SECRET_MQTT_PASSWORD=sua-senha-segura
;
; No GitHub Actions, adicione os valores em Settings > Secrets e injete via:
;
;   env:
;     SECRET_MQTT_BROKER:   ${{ secrets.SECRET_MQTT_BROKER }}
;     SECRET_MQTT_USERNAME: ${{ secrets.SECRET_MQTT_USERNAME }}
;     SECRET_MQTT_PASSWORD: ${{ secrets.SECRET_MQTT_PASSWORD }}

[env:xiao_esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8

; As variáveis SECRET_* são lidas do ambiente de shell/CI e passadas ao
; pré-processador C++. O config.h emite #error se alguma estiver ausente.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    !python3 -c "
import os, sys
missing = [v for v in ['SECRET_MQTT_BROKER','SECRET_MQTT_USERNAME','SECRET_MQTT_PASSWORD'] if not os.environ.get(v)]
if missing:
    sys.exit('ERRO de build: variáveis de ambiente não definidas: ' + ', '.join(missing))
b = os.environ['SECRET_MQTT_BROKER']
u = os.environ['SECRET_MQTT_USERNAME']
p = os.environ['SECRET_MQTT_PASSWORD']
print(f'-DSECRET_MQTT_BROKER=\\\"{b}\\\" -DSECRET_MQTT_USERNAME=\\\"{u}\\\" -DSECRET_MQTT_PASSWORD=\\\"{p}\\\"')
"

; O XIAO ESP32S3 tem 8 MB de flash
board_build.partitions = default_8MB.csv
