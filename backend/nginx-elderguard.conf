# nginx-elderguard.conf
# Substituir ${SECRET_MQTT_BROKER} antes do deploy:
#   envsubst '${SECRET_MQTT_BROKER}' < nginx-elderguard.conf > /etc/nginx/sites-available/elderguard

# /etc/nginx/sites-available/elderguard
# Após copiar: sudo ln -s /etc/nginx/sites-available/elderguard /etc/nginx/sites-enabled/
# Gerar certificado: sudo certbot --nginx -d ${SECRET_MQTT_BROKER}

server {
    listen 80;
    server_name ${SECRET_MQTT_BROKER};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${SECRET_MQTT_BROKER};

    # Certificados gerenciados pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/${SECRET_MQTT_BROKER}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SECRET_MQTT_BROKER}/privkey.pem;

    # Proxy para a API FastAPI
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
