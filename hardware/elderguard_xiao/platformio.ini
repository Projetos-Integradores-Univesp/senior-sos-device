; PlatformIO — ElderGuard XIAO ESP32S3
; pio run -t upload

[env:xiao_esp32s3]
platform = espressif32
board    = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; CDC USB serial no XIAO ESP32S3

; O XIAO ESP32S3 tem 8 MB de flash — partição padrão
board_build.partitions = default_8MB.csv
